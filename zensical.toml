[project]
site_name = "Field Glance"
site_url = "https://field-glance.liam.earth"
docs_dir = "pages"
extra_css = ["stylesheets/extra.css"]

[project.theme]
font.text = "IBM Plex Sans"
font.code = "JetBrains Mono"
logo = "static/FieldGlance.png"
favicon = "static/FieldGlance.png"

[project.theme.palette]
scheme = "slate"
primary = "custom"
accent = "custom"

[project.markdown_extensions]
admonition = {}
smarty = { "smart_dashes" = false, "smart_quotes" = true, "smart_ellipses" = false }

[project.plugins.redirects.redirect_maps]
"index.md" = "privacy-policy.md"
