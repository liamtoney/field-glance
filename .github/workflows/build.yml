name: Build app

on:
  push:
    paths:
      - 'FieldGlance/**'
      - 'FieldGlanceWatch/**'
      - 'FieldGlanceWidget/**'
      - 'FieldGlance.xcodeproj/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      # The iPhone app depends on the Watch app, which depends on the widget, so this
      # one build compiles all three targets
      - name: Build apps and widget
        run: |
          xcodebuild build \
            -project FieldGlance.xcodeproj \
            -scheme FieldGlance \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
